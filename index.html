<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eeeae2" />
  <meta name="description" content="Fiscal Generator — laboratório educacional de NF-e, CT-e e MDF-e sem validade fiscal." />
  <meta name="theme-color" content="#eeeae2" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Fiscal Generator — Ambiente de Estudo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />
  <link rel="stylesheet" href="enhancements.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">FG</div><div><strong>Fiscal</strong><span>Generator</span></div></div>
      <div class="environment"><span></span> AMBIENTE DE ESTUDO</div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>OV</span> Visão geral</button>
        <button class="nav-item" data-view="nfe"><span>NF</span> NF-e</button>
        <button class="nav-item" data-view="cte"><span>CT</span> CT-e</button>
        <button class="nav-item" data-view="mdfe"><span>MD</span> MDF-e</button>
        <button class="nav-item" data-view="documents"><span>AR</span> Documentos</button>
        <button class="nav-item" data-view="cadastros"><span>CD</span> Cadastros</button>
      </nav>
      <div class="sidebar-bottom"><button class="nav-item" data-view="settings"><span>ST</span> Configurações</button><div class="study-note">Nenhuma comunicação com a SEFAZ.<br>Todos os documentos são simulados.</div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="mobile-brand"><span class="mobile-brand-mark">FG</span><strong>Fiscal Generator</strong></div><div class="topbar-right"><span class="simulation-pill">SIMULAÇÃO</span><span class="date" id="today"></span><div class="avatar">MV</div></div></header>
      <section class="content" id="app"></section>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Navegação principal">
    <button class="mobile-nav-item active" data-view="dashboard"><span>OV</span><small>Início</small></button>
    <button class="mobile-nav-item" data-view="nfe"><span>NF</span><small>NF-e</small></button>
    <button class="mobile-nav-item mobile-nav-primary" data-view="documents"><span>+</span><small>Documentos</small></button>
    <button class="mobile-nav-item" data-view="cte"><span>CT</span><small>CT-e</small></button>
    <button class="mobile-nav-item" data-view="mdfe"><span>MD</span><small>MDF-e</small></button>
  </nav>
  <div class="toast" id="toast"></div>
  <script src="fiscal-engine.js"></script>
  <script src="lab-data.js"></script>
  <script src="xml-engine.js"></script>
  <script src="app.js"></script>
  <script src="document-renderer.js"></script>
  <script src="lab-ui.js"></script>
  <script src="enhancements.js"></script>
  <script src="responsive.js"></script>
  <script src="hardening.js"></script>
</body>
</html>
